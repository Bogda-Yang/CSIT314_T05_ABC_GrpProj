<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }} | FireflyFund</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        const retryPrefix = "fireflyfund-asset-retry";
        function reloadOnce() {
          try {
            const retryKey = `${retryPrefix}:${window.location.pathname}`;
            if (sessionStorage.getItem(retryKey) === "1") return;
            sessionStorage.setItem(retryKey, "1");
          } catch (error) {}
          const url = new URL(window.location.href);
          url.searchParams.set("_asset_retry", Date.now().toString());
          window.location.replace(url.toString());
        }
        window.__fireflyReloadOnce = reloadOnce;
        window.addEventListener("load", function () {
          window.setTimeout(function () {
            try {
              const bg = window.getComputedStyle(document.body).backgroundImage || "";
              if (!bg || bg === "none") {
                reloadOnce();
                return;
              }
              sessionStorage.removeItem(`${retryPrefix}:${window.location.pathname}`);
            } catch (error) {}
          }, 250);
        });
      })();
    </script>
    <link
      id="page-style"
      rel="stylesheet"
      href="/static/styles.css?v=20260423-active-nav-1"
      onerror="window.__fireflyReloadOnce && window.__fireflyReloadOnce()"
    />
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <a class="brand" href="/" aria-label="FireflyFund Home">
          <span class="brand-mark">
            <img src="/assets/logo" alt="FireflyFund logo" />
          </span>
          <span class="brand-text">
            <strong>FireflyFund</strong>
          </span>
        </a>
        <nav class="site-nav" aria-label="Primary navigation">
          <a href="/" class="{% if request.url.path == '/' %}is-active{% endif %}">Home</a>
          <a href="/about" class="{% if request.url.path == '/about' %}is-active{% endif %}">About Us</a>
          <a href="/transparency" class="{% if request.url.path == '/transparency' %}is-active{% endif %}">Transparency</a>
          <a href="/projects" class="{% if request.url.path == '/projects' or request.url.path.startswith('/projects/') %}is-active{% endif %}">Projects</a>
          {% if is_admin %}<a href="/dashboard" class="{% if request.url.path == '/dashboard' %}is-active{% endif %}">Dashboard</a>{% endif %}
        </nav>
        <div class="header-actions">
          {% if user_email %}
          <div class="user-menu">
            <button class="user-avatar-button" type="button" aria-expanded="false" aria-label="Open user menu">
              <span class="user-avatar{% if avatar_url %} has-image{% endif %}" id="home-user-avatar" aria-hidden="true">
                {% if avatar_url %}
                <img src="{{ avatar_url }}" alt="{{ username or 'User' }} avatar" />
                {% else %}
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <circle cx="12" cy="7.5" r="4.2" stroke="currentColor" stroke-width="1.8"></circle>
                  <path d="M6 19c1.6-3.2 3.9-5 6-5s4.4 1.8 6 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
                </svg>
                {% endif %}
              </span>
            </button>
            <div class="user-dropdown" hidden>
              <div class="user-dropdown-name">{{ username or "User" }}</div>
              <a class="user-dropdown-link" href="/profile">Profile</a>
              <a class="user-dropdown-link" href="/your-fundraisers">Your Fundraisers</a>
              <a class="user-dropdown-link" href="/your-impact">Your Impact</a>
              <a class="user-dropdown-link" href="/wallet">Wallet</a>
              <a class="user-dropdown-link" href="/settings">Settings</a>
              <a class="user-dropdown-link danger" href="/logout">Log Out</a>
            </div>
          </div>
          {% else %}
          <a class="ghost-button" href="/auth?mode=login">Login</a>
          <a class="solid-button" href="/auth?mode=register">Sign Up</a>
          {% endif %}
        </div>
      </header>

      <main class="placeholder-page">
        <section class="placeholder-card">
          <p class="eyebrow">{{ title }}</p>
          <h1>{{ title }}</h1>
          <p class="placeholder-text">{{ description }}</p>
          <a class="solid-button" href="/">Back Home</a>
        </section>
      </main>
    </div>
  </body>
</html>
