<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile | FireflyFund</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        const retryPrefix = "fireflyfund-asset-retry";
        function reloadOnce() {
          try {
            const retryKey = `${retryPrefix}:${window.location.pathname}`;
            if (sessionStorage.getItem(retryKey) === "1") return;
            sessionStorage.setItem(retryKey, "1");
          } catch (error) {}
          const url = new URL(window.location.href);
          url.searchParams.set("_asset_retry", Date.now().toString());
          window.location.replace(url.toString());
        }
        window.__fireflyReloadOnce = reloadOnce;
        window.addEventListener("load", function () {
          window.setTimeout(function () {
            try {
              const bg = window.getComputedStyle(document.body).backgroundImage || "";
              if (!bg || bg === "none") {
                reloadOnce();
                return;
              }
              sessionStorage.removeItem(`${retryPrefix}:${window.location.pathname}`);
            } catch (error) {}
          }, 250);
        });
      })();
    </script>
    <link
      id="page-style"
      rel="stylesheet"
      href="/static/styles.css?v=20260410-asset-fallback-1"
      onerror="window.__fireflyReloadOnce && window.__fireflyReloadOnce()"
    />
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <a class="brand" href="/" aria-label="FireflyFund Home">
          <span class="brand-mark">
            <img src="/assets/logo" alt="FireflyFund logo" />
          </span>
          <span class="brand-text">
            <strong>FireflyFund</strong>
          </span>
        </a>
        <nav class="site-nav" aria-label="Primary navigation">
          <a href="/">Home</a>
          <a href="/about">About Us</a>
          <a href="/transparency">Transparency</a>
          <a href="/projects">Projects</a>
        </nav>
        <div class="header-spacer" aria-hidden="true"></div>
      </header>

      <main class="account-page">
        <section class="account-card profile-card">
          <section class="profile-hero-shell">
            <section class="profile-hero">
            <p class="eyebrow">Profile</p>
            <div class="profile-avatar-panel">
              <label class="profile-avatar-upload" for="avatar-input" aria-label="Upload profile avatar">
                <input id="avatar-input" type="file" name="avatar" accept="image/jpeg,image/png,image/webp" hidden />
                <span class="user-avatar profile-avatar-frame{% if avatar_url %} has-image{% endif %}" id="profile-avatar-frame" aria-hidden="true">
                  {% if avatar_url %}
                  <img src="{{ avatar_url }}" alt="{{ username }} avatar" id="profile-avatar-image" />
                  {% else %}
                  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <circle cx="12" cy="7.5" r="4.2" stroke="currentColor" stroke-width="1.8"></circle>
                    <path d="M6 19c1.6-3.2 3.9-5 6-5s4.4 1.8 6 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
                  </svg>
                  <img src="" alt="{{ username }} avatar" id="profile-avatar-image" hidden />
                  {% endif %}
                </span>
              </label>
            </div>
            <h1 class="profile-hero-name">{{ username }}</h1>
            </section>
          </section>

          <form class="account-form" id="profile-form">
            <label class="account-field">
              <span>Username</span>
              <input type="text" name="username" value="{{ username }}" required />
            </label>

            <label class="account-field">
              <span>Email</span>
              <input type="email" name="email" value="{{ user_email }}" readonly />
            </label>

            <div class="account-field-row">
              <label class="account-field compact-field">
                <span>Gender</span>
                <select name="gender">
                  <option value="" {% if not gender %}selected{% endif %}>Select gender</option>
                  <option value="Male" {% if gender == "Male" %}selected{% endif %}>Male</option>
                  <option value="Female" {% if gender == "Female" %}selected{% endif %}>Female</option>
                  <option value="Other" {% if gender == "Other" %}selected{% endif %}>Other</option>
                  <option value="Prefer not to say" {% if gender == "Prefer not to say" %}selected{% endif %}>Prefer not to say</option>
                </select>
              </label>

              <label class="account-field compact-field">
                <span>Age</span>
                <input type="number" name="age" min="0" max="130" value="{{ age if age is not none else '' }}" />
              </label>
            </div>

            <label class="account-field">
              <span>Occupation</span>
              <input type="text" name="occupation" value="{{ occupation or '' }}" placeholder="Add your occupation" />
            </label>

            <label class="account-field">
              <span>Personal Bio</span>
              <textarea
                name="contact_details"
                rows="6"
                placeholder="Write a short personal introduction, background, or anything you want supporters to know about you."
              >{{ contact_details }}</textarea>
            </label>

            <div class="account-actions">
              <button class="solid-button" type="submit">Save Profile</button>
              <a class="ghost-button" href="/">Back Home</a>
            </div>

            <p class="account-message profile-action-message" id="profile-message"></p>
          </form>
        </section>
      </main>
    </div>

    <script
      src="/static/site.js?v=20260410-asset-fallback-1"
      onerror="window.__fireflyReloadOnce && window.__fireflyReloadOnce()"
    ></script>
  </body>
</html>
