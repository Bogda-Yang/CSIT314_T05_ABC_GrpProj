<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings | FireflyFund</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css?v=20260408-home-avatar-fix-1" />
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <a class="brand" href="/" aria-label="FireflyFund Home">
          <span class="brand-mark">
            <img src="/assets/logo" alt="FireflyFund logo" />
          </span>
          <span class="brand-text">
            <strong>FireflyFund</strong>
          </span>
        </a>
        <nav class="site-nav" aria-label="Primary navigation">
          <a href="/">Home</a>
          <a href="/about">About Us</a>
          <a href="/transparency">Transparency</a>
          <a href="/projects">Projects</a>
        </nav>
        <div class="header-spacer" aria-hidden="true"></div>
      </header>

      <main class="account-page">
        <section class="account-card">
          <div class="account-card-head">
            <div>
              <p class="eyebrow">Settings</p>
            </div>
          </div>

          <p class="account-message" id="settings-message"></p>

          <form class="account-form" id="change-password-form">
            <label class="account-field">
              <span>Current Password</span>
              <input type="password" name="current_password" required />
            </label>

            <label class="account-field">
              <span>New Password</span>
              <input type="password" name="new_password" required />
              <small class="field-hint">Use at least 6 characters with both letters and numbers.</small>
            </label>

            <label class="account-field">
              <span>Confirm New Password</span>
              <input type="password" name="confirm_new_password" required />
            </label>

            <div class="account-actions">
              <button class="solid-button" type="submit">Change Password</button>
              <a class="ghost-button" href="/profile">Go to Profile</a>
            </div>
          </form>

          <section class="danger-zone">
            <div class="danger-zone-head">
              <p class="eyebrow">Delete Account</p>
              <h2>Delete your account</h2>
            </div>

            <p class="account-message" id="delete-account-message"></p>

            <form class="account-form" id="delete-account-form">
              <label class="account-field">
                <span>Current Password</span>
                <input type="password" name="current_password" required />
              </label>

              <div class="account-actions">
                <button class="danger-button" type="submit">Delete Account</button>
              </div>
            </form>
          </section>
        </section>
      </main>
    </div>

    <script src="/static/site.js?v=20260408-home-avatar-fix-1"></script>
  </body>
</html>
